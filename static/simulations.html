<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CRI Metrics v2.4 | Simulations</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    :root {
        --bg-deep: #0d1117;
        --bg-card: #161e27;
        --bg-card-glass: rgba(22, 27, 34, 0.7);
        --text-primary: #dae3ee;
        --text-muted: #8b919d;
        --border-default: #30363d;
        --border-hover: #414752;
        --color-gspi: #f85149;
        --color-shpd: #d29922;
        --color-ltcr: #58a6ff;
        --color-cfbr: #a371f7;
        --color-uor: #3fb950;
        --color-low: #3fb950;
        --color-moderate: #d29922;
        --color-critical: #f85149;
        --color-primary: #58a6ff;
        --color-success: #3fb950;
        --color-warning: #d29922;
        --color-danger: #f85149;
        --grid-color: rgba(162, 201, 255, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-deep);
        background-image:
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .glass-panel {
        background: var(--bg-card-glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-default);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
    }
    .glass-panel:hover {
        border-color: var(--border-hover);
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-sans { font-family: 'Inter', sans-serif; }

    /* Header */
    .header {
        background: var(--bg-card-glass);
        border-bottom: 1px solid var(--border-default);
        backdrop-filter: blur(12px);
        padding: 0 40px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .header-logo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-primary);
    }
    .header-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        padding-left: 16px;
        border-left: 1px solid var(--border-default);
    }
    .live-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(63,185,80,0.12);
        border: 1px solid rgba(63,185,80,0.3);
        padding: 4px 12px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--color-success);
    }
    .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-success);
        animation: pulse-live 2s infinite ease-in-out;
    }
    @keyframes pulse-live {
        0% { transform: scale(0.8); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(0.8); opacity: 0.5; }
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid var(--border-default);
        background: rgba(48,54,61,0.5);
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(48,54,61,0.8); border-color: var(--border-hover); }
    .btn-primary {
        background: var(--color-primary);
        color: #0d1117;
        border-color: var(--color-primary);
    }
    .btn-primary:hover { background: #6db5ff; }

    /* Layout */
    .sim-layout {
        display: grid;
        grid-template-columns: 60% 40%;
        gap: 24px;
        padding: 32px 40px;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* Scenario Cards Grid */
    .scenario-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    .scenario-card {
        background: var(--bg-card-glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-default);
        border-radius: 8px;
        padding: 16px;
        height: 180px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }
    .scenario-card:hover {
        border-color: var(--color-primary);
        box-shadow: 0 0 20px rgba(88,166,255,0.15);
        transform: translateY(-2px);
    }
    .scenario-card.active {
        border-width: 2px;
        transform: translateY(-2px);
        box-shadow: 0 0 24px rgba(88,166,255,0.2);
    }
    .scenario-card .sc-icon {
        font-size: 28px;
        line-height: 1;
    }
    .scenario-card .sc-name {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-top: 4px;
        line-height: 1.3;
    }
    .scenario-card .sc-desc {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: var(--text-muted);
        line-height: 1.4;
        flex: 1;
        margin-top: 4px;
    }
    .scenario-card .sc-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
    }
    .scenario-card .sc-cri {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 700;
    }
    .scenario-card .sc-zone {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 2px 8px;
        border-radius: 3px;
        text-transform: uppercase;
    }
    .zone-low { background: rgba(63,185,80,0.15); color: #3fb950; }
    .zone-moderate { background: rgba(210,153,34,0.15); color: #d29922; }
    .zone-critical { background: rgba(248,81,73,0.15); color: #f85149; }

    /* Right Panel - Detail */
    .detail-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .detail-header {
        text-align: center;
    }
    .detail-header h3 {
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
    }
    .detail-header .detail-desc {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 6px;
    }

    /* Gauge */
    .gauge-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .gauge-container {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .gauge-container svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }
    .gauge-track {
        fill: none;
        stroke: rgba(48,54,61,0.6);
        stroke-width: 10;
    }
    .gauge-arc {
        fill: none;
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 1.5s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.5s ease;
    }
    .gauge-value {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .gauge-value .gv-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 32px;
        font-weight: 700;
        line-height: 1;
    }
    .gauge-value .gv-zone {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-top: 4px;
    }

    /* KPI Bars */
    .kpi-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .kpi-row {
        display: grid;
        grid-template-columns: 48px 1fr 52px;
        align-items: center;
        gap: 10px;
    }
    .kpi-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }
    .kpi-bar-track {
        height: 8px;
        background: rgba(48,54,61,0.5);
        border-radius: 4px;
        overflow: hidden;
    }
    .kpi-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .kpi-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 600;
        text-align: right;
    }

    /* Weight chart */
    .weight-chart-wrap {
        height: 140px;
        position: relative;
    }

    /* Bottom Comparison */
    .compare-section {
        padding: 0 40px 40px;
        max-width: 1600px;
        margin: 0 auto;
    }
    .compare-section h3 {
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 20px;
    }
    .compare-controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .compare-controls select {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 8px 12px;
        background: var(--bg-card-glass);
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        border-radius: 4px;
        cursor: pointer;
        min-width: 200px;
    }
    .compare-controls select:focus {
        outline: none;
        border-color: var(--color-primary);
    }

    .compare-cards {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        align-items: start;
    }
    .compare-card {
        background: var(--bg-card-glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-default);
        border-radius: 8px;
        padding: 24px;
    }
    .compare-card .cc-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }
    .compare-card .cc-icon {
        font-size: 24px;
    }
    .compare-card .cc-name {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
    }
    .compare-card .cc-cri {
        text-align: center;
        margin-bottom: 16px;
    }
    .compare-card .cc-cri-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 36px;
        font-weight: 700;
        line-height: 1;
    }
    .compare-card .cc-cri-zone {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-top: 4px;
        text-transform: uppercase;
    }
    .compare-kpi-row {
        display: grid;
        grid-template-columns: 40px 1fr 36px;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }
    .compare-kpi-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 600;
    }
    .compare-kpi-bar-track {
        height: 6px;
        background: rgba(48,54,61,0.5);
        border-radius: 3px;
        overflow: hidden;
    }
    .compare-kpi-bar-fill {
        height: 100%;
        border-radius: 3px;
    }
    .compare-kpi-val {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        text-align: right;
    }

    .compare-divider {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
    }
    .compare-divider .delta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 700;
    }
    .compare-divider .delta-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        margin-top: 4px;
    }

    .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
    }

    .section-title {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .section-title::before {
        content: '';
        display: inline-block;
        width: 3px;
        height: 18px;
        background: var(--color-primary);
        border-radius: 2px;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .sim-layout {
            grid-template-columns: 1fr;
            padding: 20px 16px;
        }
        .scenario-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        .compare-cards {
            grid-template-columns: 1fr;
        }
        .compare-divider {
            flex-direction: row;
            padding: 16px 0;
        }
        .header {
            padding: 0 16px;
        }
        .header-title {
            display: none;
        }
        .compare-section {
            padding: 0 16px 40px;
        }
    }
    @media (max-width: 600px) {
        .scenario-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="header-logo">CRI METRICS v2.4</span>
        <span class="header-title">Simulations</span>
        <div class="live-badge" id="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>
    </div>
    <div>
        <a class="btn" href="index.html">
            <span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>
            Main Dashboard
        </a>
    </div>
</header>

<div class="sim-layout">
    <!-- LEFT: Scenario Selector -->
    <div>
        <div class="section-title">Scenario Selector</div>
        <div class="scenario-grid" id="scenario-grid">
            <div class="loading-state">Loading scenarios...</div>
        </div>
    </div>

    <!-- RIGHT: Active Scenario Detail -->
    <div class="detail-panel">
        <div class="glass-panel" style="padding:24px;border-radius:8px;" id="detail-panel">
            <div class="loading-state" id="detail-loading">Select a scenario to view details</div>
            <div id="detail-content" style="display:none;">
                <div class="detail-header">
                    <h3 id="detail-name">--</h3>
                    <div class="detail-desc" id="detail-desc">--</div>
                </div>
                <div class="gauge-wrap">
                    <div class="gauge-container">
                        <svg viewBox="0 0 140 140">
                            <circle class="gauge-track" cx="70" cy="70" r="58"/>
                            <circle class="gauge-arc" id="detail-gauge-arc" cx="70" cy="70" r="58" stroke-dasharray="364.42" stroke-dashoffset="364.42"/>
                        </svg>
                        <div class="gauge-value">
                            <span class="gv-score" id="detail-cri-score">--</span>
                            <span class="gv-zone" id="detail-zone">--</span>
                        </div>
                    </div>
                </div>
                <div class="kpi-list" id="detail-kpi-list">
                </div>
                <div style="margin-top:16px;">
                    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.05em;">WEIGHT CONTRIBUTION</div>
                    <div class="weight-chart-wrap">
                        <canvas id="weightChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom: Comparison Section -->
<div class="compare-section">
    <div class="glass-panel" style="padding:24px;border-radius:8px;">
        <h3>Side-by-Side Comparison</h3>
        <div class="compare-controls">
            <select id="compare-select-a"></select>
            <span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text-muted);">vs</span>
            <select id="compare-select-b"></select>
            <button class="btn btn-primary" id="compare-btn" onclick="runComparison()">
                <span class="material-symbols-outlined" style="font-size:14px;">compare_arrows</span>
                Compare
            </button>
        </div>
        <div class="compare-cards" id="compare-cards">
            <div class="compare-card">
                <div class="loading-state">Select two scenarios and click Compare</div>
            </div>
            <div class="compare-divider">
                <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);">DELTA</span>
            </div>
            <div class="compare-card">
                <div class="loading-state">&nbsp;</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/v1';
    const GAUGE_CIRCUMFERENCE = 2 * Math.PI * 58;

    const KPI_COLORS = {
        'GSPI': '#f85149',
        'SHPD': '#d29922',
        'LTCR': '#58a6ff',
        'CFBR': '#a371f7',
        'UOR': '#3fb950'
    };

    let allScenarios = [];
    let activeScenarioId = null;
    let activeScenarioData = null;
    let weightChart = null;

    async function apiGet(endpoint) {
        try {
            const r = await fetch(API_BASE + endpoint);
            if (!r.ok) throw new Error(await r.text());
            return await r.json();
        } catch (e) {
            console.error('API GET failed:', endpoint, e.message);
            return null;
        }
    }

    async function apiPost(endpoint, body) {
        try {
            const r = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error(await r.text());
            return await r.json();
        } catch (e) {
            console.error('API POST failed:', endpoint, e.message);
            return null;
        }
    }

    function getZone(cri) {
        if (cri < 30) return { name: 'LOW', color: '#3fb950', class: 'zone-low' };
        if (cri < 65) return { name: 'MODERATE', color: '#d29922', class: 'zone-moderate' };
        return { name: 'CRITICAL', color: '#f85149', class: 'zone-critical' };
    }

    function buildScenarioCards(scenarios) {
        const grid = document.getElementById('scenario-grid');
        if (!scenarios || !scenarios.length) {
            grid.innerHTML = '<div class="loading-state">No scenarios available</div>';
            return;
        }
        grid.innerHTML = '';
        scenarios.forEach(s => {
            const cri = s.cri_preview || s.cri_score || 0;
            const zone = getZone(cri);
            const card = document.createElement('div');
            card.className = 'scenario-card';
            card.setAttribute('data-scenario-id', s.id);
            card.onclick = () => activateScenario(s.id);
            card.innerHTML = `
                <div>
                    <div class="sc-icon">${s.icon || '&#9889;'}</div>
                    <div class="sc-name">${s.name}</div>
                    <div class="sc-desc">${(s.description || '').substring(0, 55)}${(s.description || '').length > 55 ? '...' : ''}</div>
                </div>
                <div class="sc-footer">
                    <span class="sc-cri" style="color:${zone.color}">${cri.toFixed(1)}</span>
                    <span class="sc-zone ${zone.class}">${zone.name}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function setActiveCard(id) {
        document.querySelectorAll('.scenario-card').forEach(c => {
            c.classList.remove('active');
            c.style.borderColor = '';
        });
        const card = document.querySelector(`[data-scenario-id="${id}"]`);
        if (card) {
            card.classList.add('active');
            const s = allScenarios.find(x => x.id === id);
            if (s) {
                const cri = s.cri_preview || s.cri_score || 0;
                const zone = getZone(cri);
                card.style.borderColor = zone.color;
            }
        }
    }

    function updateGauge(cri) {
        const arc = document.getElementById('detail-gauge-arc');
        const scoreEl = document.getElementById('detail-cri-score');
        const zoneEl = document.getElementById('detail-zone');
        const zone = getZone(cri);

        arc.style.stroke = zone.color;
        arc.style.strokeDashoffset = GAUGE_CIRCUMFERENCE - (Math.min(cri, 100) / 100) * GAUGE_CIRCUMFERENCE;
        arc.style.filter = `drop-shadow(0 0 8px ${zone.color}60)`;

        const scoreColor = zone.color;
        scoreEl.style.color = scoreColor;
        scoreEl.textContent = cri.toFixed(1);
        zoneEl.style.color = scoreColor;
        zoneEl.textContent = zone.name;
    }

    function buildKpiBars(componentScores) {
        const container = document.getElementById('detail-kpi-list');
        const kpis = ['GSPI', 'SHPD', 'LTCR', 'CFBR', 'UOR'];
        container.innerHTML = '';
        kpis.forEach(kpi => {
            const info = componentScores && componentScores[kpi] ? componentScores[kpi] : null;
            const score = info ? info.normalized_score || info.value || 0 : 0;
            const color = KPI_COLORS[kpi] || '#8b919d';
            const row = document.createElement('div');
            row.className = 'kpi-row';
            row.innerHTML = `
                <span class="kpi-label" style="color:${color}">${kpi}</span>
                <div class="kpi-bar-track">
                    <div class="kpi-bar-fill" style="width:${score}%;background:${color}"></div>
                </div>
                <span class="kpi-value" style="color:${color}">${score.toFixed(1)}</span>
            `;
            container.appendChild(row);
        });
    }

    function buildWeightChart(componentScores) {
        const ctx = document.getElementById('weightChart');
        if (weightChart) weightChart.destroy();
        const kpis = ['GSPI', 'SHPD', 'LTCR', 'CFBR', 'UOR'];
        const kpiColors = ['#f85149', '#d29922', '#58a6ff', '#a371f7', '#3fb950'];
        const values = kpis.map(kpi => {
            const info = componentScores && componentScores[kpi] ? componentScores[kpi] : null;
            return info ? info.normalized_score || info.value || 0 : 0;
        });
        weightChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: kpis,
                datasets: [{
                    data: values,
                    backgroundColor: kpiColors,
                    borderRadius: 3,
                    barThickness: 18,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                return ctx.raw.toFixed(1) + '%';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        min: 0, max: 100,
                        grid: { color: 'rgba(48,54,61,0.3)' },
                        ticks: { color: '#8b919d', font: { size: 9, family: 'JetBrains Mono' }, stepSize: 20 }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { color: '#8b919d', font: { size: 9, family: 'JetBrains Mono' } }
                    }
                }
            }
        });
    }

    async function activateScenario(id) {
        if (activeScenarioId === id && activeScenarioData) {
            setActiveCard(id);
            renderDetail(activeScenarioData);
            return;
        }

        const result = await apiPost('/simulate-scenario', { scenario_id: id });
        if (!result || !result.data) {
            console.error('Failed to activate scenario:', id);
            return;
        }

        activeScenarioId = id;
        activeScenarioData = result.data;
        setActiveCard(id);
        renderDetail(result.data);

        const s = allScenarios.find(x => x.id === id);
        if (s) {
            document.getElementById('detail-name').textContent = s.name;
            document.getElementById('detail-desc').textContent = s.description || '';
        }
    }

    function renderDetail(data) {
        const cri = data.cri_score || 0;
        const comps = data.component_scores || data.components || {};

        document.getElementById('detail-loading').style.display = 'none';
        document.getElementById('detail-content').style.display = '';

        updateGauge(cri);
        buildKpiBars(comps);
        buildWeightChart(comps);
    }

    async function loadScenarios() {
        const result = await apiGet('/scenarios');
        if (result && result.scenarios) {
            allScenarios = result.scenarios;
            buildScenarioCards(result.scenarios);

            const selects = ['compare-select-a', 'compare-select-b'];
            selects.forEach(sid => {
                const sel = document.getElementById(sid);
                sel.innerHTML = '<option value="">-- Select --</option>' +
                    result.scenarios.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            });

            // Auto-activate first scenario
            if (result.scenarios.length > 0) {
                activateScenario(result.scenarios[0].id);
            }
        }
    }

    async function runComparison() {
        const a = document.getElementById('compare-select-a').value;
        const b = document.getElementById('compare-select-b').value;
        const cardsEl = document.getElementById('compare-cards');

        if (!a || !b) {
            cardsEl.innerHTML = `
                <div class="compare-card"><div class="loading-state">Please select both scenarios</div></div>
                <div class="compare-divider"></div>
                <div class="compare-card"><div class="loading-state">&nbsp;</div></div>
            `;
            return;
        }

        cardsEl.innerHTML = `
            <div class="compare-card"><div class="loading-state">Comparing...</div></div>
            <div class="compare-divider"></div>
            <div class="compare-card"><div class="loading-state">Comparing...</div></div>
        `;

        const result = await apiGet(`/simulation-compare?scenario_a=${encodeURIComponent(a)}&scenario_b=${encodeURIComponent(b)}`);

        if (!result || !result.a || !result.b) {
            cardsEl.innerHTML = `
                <div class="compare-card"><div class="loading-state">Comparison failed</div></div>
                <div class="compare-divider"></div>
                <div class="compare-card"><div class="loading-state">&nbsp;</div></div>
            `;
            return;
        }

        renderCompareCards(result.a, result.b);
    }

    function renderCompareCards(dataA, dataB) {
        const criA = dataA.cri_score || 0;
        const criB = dataB.cri_score || 0;
        const delta = criA - criB;
        const zoneA = getZone(criA);
        const zoneB = getZone(criB);
        const compsA = dataA.component_scores || dataA.components || {};
        const compsB = dataB.component_scores || dataB.components || {};

        const kpis = ['GSPI', 'SHPD', 'LTCR', 'CFBR', 'UOR'];

        function buildCard(data, cri, zone, comps) {
            const scoreA = comps['GSPI'] ? (comps['GSPI'].normalized_score || comps['GSPI'].value || 0) : 0;
            const scoreB = comps['SHPD'] ? (comps['SHPD'].normalized_score || comps['SHPD'].value || 0) : 0;
            const scoreC = comps['LTCR'] ? (comps['LTCR'].normalized_score || comps['LTCR'].value || 0) : 0;
            const scoreD = comps['CFBR'] ? (comps['CFBR'].normalized_score || comps['CFBR'].value || 0) : 0;
            const scoreE = comps['UOR'] ? (comps['UOR'].normalized_score || comps['UOR'].value || 0) : 0;
            const kpiScores = { 'GSPI': scoreA, 'SHPD': scoreB, 'LTCR': scoreC, 'CFBR': scoreD, 'UOR': scoreE };

            let kpiHTML = kpis.map(kpi => {
                const v = kpiScores[kpi];
                const color = KPI_COLORS[kpi];
                return `
                    <div class="compare-kpi-row">
                        <span class="compare-kpi-label" style="color:${color}">${kpi}</span>
                        <div class="compare-kpi-bar-track">
                            <div class="compare-kpi-bar-fill" style="width:${v}%;background:${color}"></div>
                        </div>
                        <span class="compare-kpi-val" style="color:${color}">${v.toFixed(1)}</span>
                    </div>`;
            }).join('');

            return `
                <div class="compare-card">
                    <div class="cc-header">
                        <span class="cc-icon">${data.icon || '&#9889;'}</span>
                        <span class="cc-name">${data.name || data.scenario_name || data.id || '--'}</span>
                    </div>
                    <div class="cc-cri">
                        <span class="cc-cri-score" style="color:${zone.color}">${cri.toFixed(1)}</span>
                        <div class="cc-cri-zone" style="color:${zone.color}">${zone.name}</div>
                    </div>
                    ${kpiHTML}
                </div>`;
        }

        const deltaColor = delta > 0 ? '#f85149' : delta < 0 ? '#3fb950' : '#8b919d';
        const deltaSign = delta > 0 ? '+' : '';
        const deltaIcon = delta > 0 ? 'arrow_upward' : delta < 0 ? 'arrow_downward' : 'remove';

        document.getElementById('compare-cards').innerHTML = `
            ${buildCard(dataA, criA, zoneA, compsA)}
            <div class="compare-divider">
                <span class="material-symbols-outlined" style="font-size:28px;color:${deltaColor}">${deltaIcon}</span>
                <span class="delta" style="color:${deltaColor}">${deltaSign}${Math.abs(delta).toFixed(1)}</span>
                <span class="delta-label">CRI DELTA</span>
            </div>
            ${buildCard(dataB, criB, zoneB, compsB)}
        `;
    }

    async function checkMode() {
        const result = await apiGet('/mode');
        if (!result) return;
        const badge = document.getElementById('live-badge');
        const dot = badge.querySelector('.live-dot');
        if (result.is_simulation) {
            badge.style.background = 'rgba(248,81,73,0.12)';
            badge.style.borderColor = 'rgba(248,81,73,0.3)';
            badge.style.color = '#f85149';
            dot.style.background = '#f85149';
            badge.childNodes[badge.childNodes.length - 1].textContent = 'SIM';
        } else {
            badge.style.background = 'rgba(63,185,80,0.12)';
            badge.style.borderColor = 'rgba(63,185,80,0.3)';
            badge.style.color = '#3fb950';
            dot.style.background = '#3fb950';
            badge.childNodes[badge.childNodes.length - 1].textContent = 'LIVE';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadScenarios();
        checkMode();
        setInterval(checkMode, 5000);
    });
</script>

</body>
</html>
