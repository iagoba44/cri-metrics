<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRI Dashboard - Riesgo de Ajuste IA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --danger: #f85149;
            --warning: #d29922;
            --success: #3fb950;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        h1 { font-size: 1.8rem; font-weight: 700; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-danger { background: var(--danger); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .big-number {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }
        .zone-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 10px;
        }
        .zone-low { background: rgba(63, 185, 80, 0.2); color: var(--success); }
        .zone-moderate { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
        .zone-critical { background: rgba(248, 81, 73, 0.2); color: var(--danger); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .kpi-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 15px;
        }
        .kpi-name { font-size: 0.75rem; color: var(--text-muted); }
        .kpi-value { font-size: 1.5rem; font-weight: 700; margin-top: 5px; }
        .kpi-source { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; }
        .kpi-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .kpi-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 10px;
        }
        .log {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-muted);
        }
        .log-entry { margin-bottom: 4px; }
        .log-time { color: #484f58; }
        .log-info { color: var(--accent); }
        .log-error { color: var(--danger); }
        .log-success { color: var(--success); }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .source-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid var(--accent);
        }
        .source-name { font-weight: 600; font-size: 0.9rem; }
        .source-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
        .source-status { font-size: 0.75rem; margin-top: 8px; }
        .status-ok { color: var(--success); }
        .status-warn { color: var(--warning); }
        .status-error { color: var(--danger); }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>CRI Dashboard</h1>
                <div class="subtitle">Indice de Riesgo Compuesto - Infraestructura IA</div>
            </div>
            <div class="controls">
                <button onclick="runIngestion()" id="btn-ingest">
                    🔄 Ingesta Real
                </button>
                <button onclick="calculateCRI()" id="btn-calc" class="btn-secondary">
                    📊 Calcular CRI
                </button>
                <button onclick="forceRefresh()" class="btn-secondary">
                    🔃 Refresh
                </button>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-title">CRI Score Actual</div>
                <div class="big-number" id="cri-score">--</div>
                <div id="cri-zone" class="zone-badge zone-low">SIN DATOS</div>
                <div style="margin-top:15px; font-size:0.8rem; color:var(--text-muted)">
                    Ultimo calculo: <span id="last-calc">--</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Historial CRI (ultimas 24h)</div>
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">KPIs Individuales</div>
            <div class="kpi-grid" id="kpi-grid">
                <!-- Se llena dinamicamente -->
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-title">Composicion del Riesgo</div>
                <div class="chart-container">
                    <canvas id="compositionChart"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Fuentes de Datos</div>
                <div class="sources-grid" id="sources-grid">
                    <!-- Se llena dinamicamente -->
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Log de Operaciones</div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        let historyChart = null;
        let compositionChart = null;

        function log(msg, type='info') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString('es-ES');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
            logEl.insertBefore(entry, logEl.firstChild);
        }

        async function apiCall(method, endpoint, body=null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (body) options.body = JSON.stringify(body);
                const response = await fetch(API_BASE + endpoint, options);
                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(err);
                }
                return await response.json();
            } catch (e) {
                log(`Error API: ${e.message}`, 'error');
                throw e;
            }
        }

        async function runIngestion() {
            const btn = document.getElementById('btn-ingest');
            btn.disabled = true;
            log('Iniciando ingesta desde fuentes reales...', 'info');
            try {
                const data = await apiCall('POST', '/run-ingestion?use_real=true');
                log(`Ingesta completada: ${data.inserted} registros desde ${data.message.includes('reales') ? 'fuentes reales' : 'simuladores'}`, 'success');
                await loadLatestCRI();
            } catch (e) {
                log('Fallo en ingesta', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function calculateCRI() {
            const btn = document.getElementById('btn-calc');
            btn.disabled = true;
            log('Calculando CRI...', 'info');
            try {
                const data = await apiCall('POST', '/calculate-cri');
                const cri = data.data;
                updateDashboard(cri);
                log(`CRI calculado: ${cri.cri_score} (${cri.risk_zone})`, cri.risk_zone === 'CRITICAL' ? 'error' : 'success');
            } catch (e) {
                log('Fallo en calculo', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function updateDashboard(cri) {
            document.getElementById('cri-score').textContent = cri.cri_score;
            const zoneEl = document.getElementById('cri-zone');
            zoneEl.textContent = cri.risk_zone;
            zoneEl.className = 'zone-badge ' + (
                cri.risk_zone === 'LOW' ? 'zone-low' :
                cri.risk_zone === 'MODERATE' ? 'zone-moderate' : 'zone-critical'
            );
            document.getElementById('last-calc').textContent = new Date(cri.timestamp).toLocaleString('es-ES');

            // KPIs
            const kpiGrid = document.getElementById('kpi-grid');
            kpiGrid.innerHTML = '';
            if (cri.component_scores) {
                const colors = {
                    'GSPI': '#f85149',
                    'SHPD': '#d29922',
                    'LTCR': '#58a6ff',
                    'CFBR': '#a371f7',
                    'UOR': '#3fb950'
                };
                for (const [kpi, details] of Object.entries(cri.component_scores)) {
                    const div = document.createElement('div');
                    div.className = 'kpi-item';
                    div.innerHTML = `
                        <div class="kpi-name">${kpi}</div>
                        <div class="kpi-value" style="color:${colors[kpi]||'#fff'}">${details.normalized_score.toFixed(1)}</div>
                        <div class="kpi-source">raw: ${details.raw_value.toFixed(2)} | weight: ${details.weight} | contrib: ${(details.normalized_score * details.weight).toFixed(2)}</div>
                        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${details.normalized_score}%; background:${colors[kpi]||'#fff'}"></div></div>
                    `;
                    kpiGrid.appendChild(div);
                }
            }

            // Composition chart
            if (compositionChart) {
                compositionChart.destroy();
            }
            const ctx = document.getElementById('compositionChart').getContext('2d');
            if (cri.component_scores) {
                const labels = Object.keys(cri.component_scores);
                const values = labels.map(k => cri.component_scores[k].normalized_score * cri.component_scores[k].weight);
                compositionChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: ['#f85149', '#d29922', '#58a6ff', '#a371f7', '#3fb950'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { color: '#c9d1d9' } }
                        }
                    }
                });
            }
        }

        async function loadLatestCRI() {
            try {
                const data = await apiCall('GET', '/latest-cri');
                updateDashboard(data);
                log(`Cargado CRI: ${data.cri_score} (${data.risk_zone})`, 'info');
            } catch (e) {
                log('No hay datos CRI previos. Ejecute ingesta + calculo.', 'warn');
            }
        }

        function renderSources() {
            const sources = [
                { name: 'Vast.ai', desc: 'Precios spot GPU y ocupacion', kpi: 'GSPI, UOR', status: 'ok' },
                { name: 'CoinGecko', desc: 'Volatilidad mercado crypto', kpi: 'CFBR', status: 'ok' },
                { name: 'Binance', desc: 'Volumen ETH y volatilidad', kpi: 'CFBR', status: 'ok' },
                { name: 'WhatToMine', desc: 'Rentabilidad minera GPU', kpi: 'SHPD', status: 'ok' },
                { name: 'Yahoo Finance', desc: 'Acciones infra IA (NVDA, SMCI...)', kpi: 'LTCR', status: 'ok' },
                { name: 'Lambda Labs', desc: 'Precios cloud GPU alternativos', kpi: 'SHPD', status: 'ok' },
                { name: 'FRED (Fed)', desc: 'Capacidad industrial macro', kpi: 'LTCR', status: 'warn' },
            ];
            const grid = document.getElementById('sources-grid');
            sources.forEach(s => {
                const div = document.createElement('div');
                div.className = 'source-card';
                div.innerHTML = `
                    <div class="source-name">${s.name}</div>
                    <div class="source-desc">${s.desc}</div>
                    <div class="source-status">
                        <span class="status-${s.status}">●</span> KPIs: ${s.kpi}
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        async function loadHistory() {
            try {
                // En una implementacion completa, agregariamos un endpoint /history
                // Por ahora, mostramos un grafico vacio o placeholder
                const ctx = document.getElementById('historyChart').getContext('2d');
                historyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['T-5h', 'T-4h', 'T-3h', 'T-2h', 'T-1h', 'Ahora'],
                        datasets: [{
                            label: 'CRI Score',
                            data: [45, 48, 52, 50, 55, 55],
                            borderColor: '#58a6ff',
                            backgroundColor: 'rgba(88, 166, 255, 0.1)',
                            fill: true,
                            tension: 0.4
                        }, {
                            label: 'Umbral Critical',
                            data: [65, 65, 65, 65, 65, 65],
                            borderColor: '#f85149',
                            borderDash: [5, 5],
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { min: 0, max: 100, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                            x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                        },
                        plugins: {
                            legend: { labels: { color: '#c9d1d9' } }
                        }
                    }
                });
            } catch (e) {
                log('Error cargando historial', 'error');
            }
        }

        function forceRefresh() {
            log('Refrescando dashboard...', 'info');
            loadLatestCRI();
        }

        // Inicializacion
        document.addEventListener('DOMContentLoaded', () => {
            renderSources();
            loadHistory();
            loadLatestCRI();
            log('Dashboard CRI inicializado', 'success');
            log('Haga click en "Ingesta Real" para cargar datos del mercado', 'info');
        });
    </script>
</body>
</html>
