services:
  - type: web
    name: cri-metrics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./cri_metrics.db
      - key: ALERT_THRESHOLD
        value: 65.0
      - key: DATA_FRESHNESS_HOURS
        value: 24
      - key: ALERT_WEBHOOK_URL
        sync: false  # El usuario debe configurar manualmente en el dashboard
