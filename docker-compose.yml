version: '3.8'

services:
  cri-api:
    build: .
    container_name: cri-metrics-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cri_metrics.db
      - ALERT_THRESHOLD=65.0
      - DATA_FRESHNESS_HOURS=24
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - ALPHAVANTAGE_KEY=${ALPHAVANTAGE_KEY:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - cri-data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Opcional: PostgreSQL para produccion
  # db:
